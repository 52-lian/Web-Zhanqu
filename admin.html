<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战区查询 - 后台管理</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #299f92;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #299f92;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-group input {
            padding-left: 45px;
        }

        .login-btn {
            background: linear-gradient(135deg, #299f92 0%, #1e7a6f 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #299f92;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .admin-panel {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: #299f92;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #299f92;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #299f92;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div class="login-container" id="loginForm">
        <div class="login-header">
            <h1><i class="fas fa-crown"></i> 战区查询</h1>
            <p>后台管理系统</p>
        </div>
        
        <form class="login-form" id="adminLoginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
            
            <div class="error-message" id="errorMessage">
                用户名或密码错误，请重试
            </div>
            
            <div class="success-message" id="successMessage">
                登录成功，正在跳转...
            </div>
        </form>
        
        <div class="back-link">
            <a href="./index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>
    </div>

    <!-- 后台面板 -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> 战区查询后台</h1>
            <p>欢迎回来，管理员</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">1,234</div>
                <div class="stat-label">今日访问</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">567</div>
                <div class="stat-label">查询次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">89</div>
                <div class="stat-label">新增用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">99.9%</div>
                <div class="stat-label">系统稳定性</div>
            </div>
        </div>
        
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> 退出登录
        </button>
    </div>

    <script>
        // 假的后台登录系统
        class AdminSystem {
            constructor() {
                this.loginForm = document.getElementById('adminLoginForm');
                this.loginContainer = document.getElementById('loginForm');
                this.adminPanel = document.getElementById('adminPanel');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                
                this.init();
            }
            
            init() {
                this.loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });
                
                // 监听用户名输入框变化，自动清空密码
                const usernameInput = document.getElementById('username');
                usernameInput.addEventListener('input', () => {
                    document.getElementById('password').value = '';
                    // 隐藏错误消息
                    this.errorMessage.style.display = 'none';
                    this.successMessage.style.display = 'none';
                });
                
                // 检查是否已经登录
                if (localStorage.getItem('adminLoggedIn') === 'true') {
                    this.showAdminPanel();
                }
            }
            
            handleLogin() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // 隐藏之前的消息
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
                
                // 重置动画
                this.errorMessage.style.animation = 'none';
                
                // 模拟登录验证（这里设置假账号密码）
                if (this.validateCredentials(username, password)) {
                    this.showSuccessMessage();
                    setTimeout(() => {
                        this.showAdminPanel();
                        localStorage.setItem('adminLoggedIn', 'true');
                    }, 1500);
                } else {
                    // 延迟显示错误消息，确保动画重置
                    setTimeout(() => {
                        this.showErrorMessage();
                    }, 10);
                }
            }
            
            validateCredentials(username, password) {
                // 这里设置假账号密码
                const validCredentials = [
                    { username: 'admin', password: 'admin123' },
                    { username: 'qianyue', password: 'qianyue2024' },
                    { username: 'lian', password: 'lian123' }
                ];
                
                return validCredentials.some(cred => 
                    cred.username === username && cred.password === password
                );
            }
            
            showErrorMessage() {
                this.errorMessage.style.display = 'block';
                // 强制重新触发动画
                this.errorMessage.offsetHeight; // 触发重排
                this.errorMessage.style.animation = 'shake 0.5s ease';
            }
            
            showSuccessMessage() {
                this.successMessage.style.display = 'block';
            }
            
            showAdminPanel() {
                this.loginContainer.style.display = 'none';
                this.adminPanel.style.display = 'block';
            }
            
            logout() {
                localStorage.removeItem('adminLoggedIn');
                this.adminPanel.style.display = 'none';
                this.loginContainer.style.display = 'block';
                this.loginForm.reset();
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
            }
        }
        
        // 初始化后台系统
        const adminSystem = new AdminSystem();
        
        // 全局退出登录函数
        function logout() {
            adminSystem.logout();
        }
        
        // 添加抖动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
